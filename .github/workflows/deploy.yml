name: Despliegue en servidor propio

# Se ejecuta cuando la CI termina con éxito en main (producción) o staging.
# Solo despliega si la variable del repositorio DEPLOY_ENABLED = "true" y existen los secrets SSH
# del entorno correspondiente (ver docs/deployment-server.md → CI/CD).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno"
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || (inputs.environment == 'staging' && 'staging' || 'main') }}
    steps:
      - name: Preparar clave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Falta el secret SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Falta el secret SSH_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Desplegar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ayto-jaca' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && ./deploy/scripts/deploy.sh '$BRANCH'"
      - name: Comprobar healthcheck público
        if: ${{ vars.PUBLIC_URL != '' }}
        run: curl -fsS "${{ vars.PUBLIC_URL }}/api/health"
      - name: Limpiar clave
        if: always()
        run: rm -f ~/.ssh/id_deploy
