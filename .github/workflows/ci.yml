name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ayto
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ayto_jaca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ayto" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ayto:ci_only_password@localhost:5432/ayto_jaca
      TEST_DATABASE_URL: postgresql://ayto:ci_only_password@localhost:5432/ayto_jaca_test
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      NEXT_PUBLIC_DEMO_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitarios e integración
        run: npm run test
      - name: Build
        run: npm run build
      - name: Instalar navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: Tests E2E y accesibilidad
        run: npm run test:e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
