# ─────────────────────────────────────────────────────────────
# Nginx — proxy inverso para la web del Ayuntamiento de Jaca
# Copiar a /etc/nginx/sites-available/ayto-jaca.conf y sustituir
# demo.aytojaca.es por el dominio real (ver docs/deployment-server.md).
# Certbot añadirá/ajustará automáticamente las rutas de los certificados.
# ─────────────────────────────────────────────────────────────

upstream ayto_jaca_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Límite de peticiones para el acceso al panel y APIs sensibles
limit_req_zone $binary_remote_addr zone=ayto_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ayto_api:10m rate=60r/m;

# HTTP → HTTPS (y validación de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name demo.aytojaca.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.aytojaca.es;

    ssl_certificate     /etc/letsencrypt/live/demo.aytojaca.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.aytojaca.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Subidas desde el panel (PDF hasta 15 MB)
    client_max_body_size 20m;

    # Compresión
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    # Cabeceras de seguridad (la aplicación añade además CSP y el resto)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    access_log /var/log/nginx/ayto-jaca.access.log;
    error_log  /var/log/nginx/ayto-jaca.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    # Archivos estáticos con hash de Next.js: caché de larga duración
    location /_next/static/ {
        proxy_pass http://ayto_jaca_app;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://ayto_jaca_app;
        expires 30d;
    }

    # Archivos subidos desde el panel (los sirve la aplicación con tipo y nosniff)
    location /uploads/ {
        proxy_pass http://ayto_jaca_app;
        expires 30d;
    }

    # Endpoints sensibles con límite de peticiones adicional
    location /api/auth/ {
        limit_req zone=ayto_login burst=5 nodelay;
        proxy_pass http://ayto_jaca_app;
    }
    location = /admin/login {
        limit_req zone=ayto_login burst=5 nodelay;
        proxy_pass http://ayto_jaca_app;
    }
    location /api/ {
        limit_req zone=ayto_api burst=30 nodelay;
        proxy_pass http://ayto_jaca_app;
    }

    # La tarea programada solo desde el propio servidor
    location /api/cron/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://ayto_jaca_app;
    }

    location / {
        proxy_pass http://ayto_jaca_app;
    }
}
